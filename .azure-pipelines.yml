jobs:
- job: Windows

  pool:
    vmImage: 'windows-2022'

  variables:
  - group: uno-codesign-vault
  - name: NUGET_PACKAGES
    value: $(Agent.WorkFolder)\.nuget

  steps:
  - checkout: self
    clean: true

  # GitVersion 5.6.8 runs on .NET 5, which hosted images no longer ship.
  - task: UseDotNet@2
    displayName: Use .NET 5 runtime for GitVersion
    retryCountOnTaskFailure: 3
    inputs:
      packageType: runtime
      version: 5.0.x

  - task: gitversion/setup@0
    retryCountOnTaskFailure: 3
    inputs:
      versionSpec: '5.6.8'

  - task: gitversion/execute@0
    retryCountOnTaskFailure: 3
    inputs:
      updateAssemblyInfo: 'False'
      useConfigFile: true
      configFilePath: gitversion.yml
    displayName: Use GitVersion

  - task: UseDotNet@2
    displayName: Use .NET 10 SDK
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: 10.0.x

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: ColorCode.sln
      arguments: -c Release -p:GeneratePackageOnBuild=true -p:PackageVersion=$(GitVersion.FullSemVer) -p:PackageOutputPath=$(build.artifactstagingdirectory)

  - task: PowerShell@2
    displayName: Authenticode Sign Packages
    inputs:
      filePath: build/Sign-Package.ps1
    env:
      VaultSignTenantId: $(VaultSignTenantId)
      VaultSignClientId: $(VaultSignClientId)
      VaultSignClientSecret: $(VaultSignClientSecret)
      VaultSignCertificate: $(VaultSignCertificate)
      VaultSignUrl: $(VaultSignUrl)
      SignPackageName: "Uno.ColorCode"
      SignPackageDescription: "Uno.ColorCode"
      ArtifactDirectory: $(build.artifactstagingdirectory)
    condition: and(succeeded(), not(eq(variables['build.reason'], 'PullRequest')))

  # Release def 31 pushes every uno build to nuget.org without approval: an unsigned package must fail the build.
  - pwsh: |
      $nupkgs = Get-ChildItem "$(build.artifactstagingdirectory)" -Recurse -Filter *.nupkg
      if (-not $nupkgs) { Write-Error "No packages found"; exit 1 }
      foreach ($nupkg in $nupkgs) {
        dotnet nuget verify --all $nupkg.FullName
        if ($LASTEXITCODE -ne 0) { exit 1 }
      }
    displayName: Verify package signatures
    condition: and(succeeded(), not(eq(variables['build.reason'], 'PullRequest')))

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: drop
      ArtifactType: Container
