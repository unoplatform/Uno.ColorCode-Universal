jobs:
- job: Windows

  pool:
    vmImage: 'windows-2022'

  variables:
    NUGET_PACKAGES: $(Agent.WorkFolder)\.nuget

  steps:
  - checkout: self
    clean: true

  # GitVersion 5.6.8 runs on .NET 5, which hosted images no longer ship.
  - task: UseDotNet@2
    displayName: Use .NET 5 runtime for GitVersion
    retryCountOnTaskFailure: 3
    inputs:
      packageType: runtime
      version: 5.0.x

  - task: gitversion/setup@0
    retryCountOnTaskFailure: 3
    inputs:
      versionSpec: '5.6.8'

  - task: gitversion/execute@0
    retryCountOnTaskFailure: 3
    inputs:
      updateAssemblyInfo: 'False'
      useConfigFile: true
      configFilePath: gitversion.yml
    displayName: Use GitVersion

  - task: UseDotNet@2
    displayName: Use .NET 10 SDK
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: 10.0.x

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: ColorCode.sln
      arguments: -c Release -p:GeneratePackageOnBuild=true -p:PackageVersion=$(GitVersion.FullSemVer) -p:PackageOutputPath=$(build.artifactstagingdirectory)

  - task: DotNetCoreInstaller@0
    inputs:
      version: '2.1.504'

  - task: PowerShell@2
    displayName: Authenticode Sign Packages
    inputs:
      filePath: build/Sign-Package.ps1
    env:
      SignClientUser: $(SignClientUser)
      SignClientSecret: $(SignClientSecret)
      SignPackageName: "Uno.PackageDiff"
      SignPackageDescription: "Uno.PackageDiff"
      ArtifactDirectory: $(build.artifactstagingdirectory)
    condition: and(succeeded(), not(eq(variables['build.reason'], 'PullRequest')), not(eq(variables['SignClientSecret'], '')), not(eq(variables['SignClientUser'], '')))

  - task: PublishBuildArtifacts@1
    condition: always()
    inputs:
      PathtoPublish: $(build.artifactstagingdirectory)
      ArtifactName: drop
      ArtifactType: Container
